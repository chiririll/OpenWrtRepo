name: packages

on:
  workflow_dispatch:

concurrency:
  group: packages
  cancel-in-progress: false

# All logic lives in scripts/ci/*.sh; every script runs from the repo root.
jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(python3 scripts/matrix.py)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      VERSION: ${{ matrix.version }}
      TARGET: ${{ matrix.target }}
      SUBTARGET: ${{ matrix.subtarget }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Prepare signing key
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: sh scripts/ci/prepare-key.sh

      - name: Cache SDK tarball
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-cache
          key: sdk-${{ matrix.version }}-${{ matrix.target }}-${{ matrix.subtarget }}

      - name: Download SDK
        env:
          SDK_CACHE: ${{ runner.temp }}/sdk-cache
        run: sh scripts/ci/download-sdk.sh

      # Source tarballs fetched by package Makefiles. Restored after the SDK is unpacked.
      - name: Cache source downloads
        uses: actions/cache@v4
        with:
          path: sdk/dl
          key: dl-${{ matrix.version }}-${{ matrix.arch }}-${{ hashFiles('config.yml', 'feeds.yml') }}
          restore-keys: |
            dl-${{ matrix.version }}-${{ matrix.arch }}-

      - name: Set up feeds
        run: sh scripts/ci/setup-feeds.sh

      - name: Build packages
        run: sh scripts/ci/build.sh

      - name: Collect, index and sign
        run: sh scripts/ci/collect.sh

      - uses: actions/upload-artifact@v4
        with:
          name: repo-${{ matrix.target }}-${{ matrix.subtarget }}
          path: out
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - uses: actions/download-artifact@v4
        with:
          path: parts

      - name: Update gh-pages checkout with the rebuilt versions
        env:
          PAGES_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: sh scripts/ci/pages-prepare.sh

      - name: Build landing page
        run: sh scripts/ci/site-build.sh

      - name: Commit and push
        run: sh scripts/ci/pages-push.sh
